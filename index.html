<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stencil Generator</title>
<meta name="description" content="Turn a reference photo into a print-ready realism tattoo stencil.">
<!-- Cache-busting: GitHub Pages sets Cache-Control: max-age=600 on every file and
     gives no way to change that, so a stale copy can be served (from GitHub's edge
     cache or a visitor's browser) for up to 10 minutes after a deploy. Bumping the
     ?v= below whenever js/ or css/ changes makes each new deploy a new URL, which
     no cache layer can serve stale — must match ASSET_VERSION in js/main.js. -->
<link rel="stylesheet" href="css/styles.css?v=12">
</head>
<body>
<header class="app-header">
  <h1>Stencil Generator</h1>
  <button id="reset-btn" class="ghost-btn" hidden>New Photo</button>
</header>

<main id="app">

  <section id="upload-view" class="upload-view">
    <label for="file-input" class="upload-dropzone" id="dropzone">
      <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path fill="currentColor" d="M12 3l5 5h-3v6h-4V8H7l5-5zm-7 14h14v2H5v-2z"/></svg>
      <span class="upload-title">Upload a photo</span>
      <span class="upload-hint">Tap to choose a PNG or JPEG. Nothing leaves your device — all processing happens right here in the browser, using a bundled AI model (~17MB, downloaded once and cached).</span>
    </label>
    <input type="file" id="file-input" accept="image/png,image/jpeg" hidden>
  </section>

  <section id="editor-view" class="editor-view" hidden>

    <div class="preview-modes" role="tablist">
      <button class="mode-btn" data-mode="original" role="tab" aria-selected="false">Original</button>
      <button class="mode-btn active" data-mode="stencil" role="tab" aria-selected="true">Stencil</button>
      <button class="mode-btn" data-mode="reference" role="tab" aria-selected="false">Reference</button>
      <button class="mode-btn" data-mode="colour" role="tab" aria-selected="false">ST + RF</button>
    </div>

    <div class="canvas-viewport" id="canvas-viewport">
      <div class="canvas-stage" id="canvas-stage">
        <canvas id="canvas-original" hidden></canvas>
        <canvas id="canvas-stencil"></canvas>
        <canvas id="canvas-reference" hidden></canvas>
        <canvas id="canvas-colour" hidden></canvas>
        <div class="processing-overlay" id="processing-overlay" hidden>
          <div class="spinner"></div>
          <span id="processing-label">Processing&hellip;</span>
        </div>
      </div>
    </div>

    <div class="zoom-controls" id="zoom-controls">
      <button type="button" class="zoom-btn" id="zoom-out-btn" aria-label="Zoom out">&minus;</button>
      <button type="button" class="zoom-btn zoom-fit-btn" id="zoom-reset-btn">Fit</button>
      <button type="button" class="zoom-btn" id="zoom-in-btn" aria-label="Zoom in">+</button>
      <span class="zoom-hint">Pinch or scroll to zoom &mdash; inspect at print size before exporting</span>
    </div>

    <!-- Stencil mode only. -->
    <div id="stencil-sliders">
      <label class="slider-row">
        <span>Keep Detail <output id="out-keep-detail"></output></span>
        <input type="range" id="in-keep-detail" min="0" max="120" step="1" value="15">
      </label>

      <label class="slider-row">
        <span>Background Cleanup <output id="out-bg-cleanup"></output></span>
        <input type="range" id="in-bg-cleanup" min="150" max="255" step="1" value="225">
      </label>

      <label class="slider-row">
        <span>Line Thickness <output id="out-thickness"></output></span>
        <input type="range" id="in-thickness" min="-25" max="25" step="1" value="0">
      </label>

      <!-- Invert lines: disabled for now, kept in the DOM (hidden) so it can be re-enabled later by removing `hidden`. -->
      <label class="checkbox-row" hidden><input type="checkbox" id="in-invert"> Invert lines</label>
    </div>

    <!-- Settings: which rows are visible depends on the selected mode (see main.js's
         updateModeVisibility) — DOM order is the union of every mode's order, so
         showing any subset preserves the right relative order. Sits below the
         sliders, above Export. -->
    <details class="control-group" id="settings-group" open>
      <summary><h2>Settings</h2></summary>

      <label class="select-row" id="row-model">
        <span>Model</span>
        <select id="in-line-style">
          <option value="stencil" selected>Stencil (Smooth &amp; Crisp)</option>
          <option value="soft">Soft (Network)</option>
          <option value="threshold">Crisp (Fixed Threshold)</option>
          <option value="auto-threshold">Crisp (Auto Threshold)</option>
          <option value="clean">Clean Lines (Skeleton + Re-stroke)</option>
        </select>
      </label>

      <label class="checkbox-row" id="row-sharpen"><input type="checkbox" id="in-presharpen"> Sharpen source photo before analysis</label>

      <label class="checkbox-row" id="row-ref-posterize"><input type="checkbox" id="in-ref-posterize"> Simplify reference image into tone bands</label>

      <label class="slider-row" id="row-ref-levels">
        <span>Reference Levels <output id="out-ref-levels"></output></span>
        <input type="range" id="in-ref-levels" min="4" max="16" step="1" value="8">
      </label>

      <label class="slider-row" id="row-ref-opacity">
        <span>Reference Opacity <output id="out-ref-opacity"></output></span>
        <input type="range" id="in-ref-opacity" min="0" max="100" step="1" value="60">
      </label>

      <div class="swatch-block" id="row-colour">
        <span>Stencil Colour</span>
        <div class="swatch-row" id="colour-swatches" role="radiogroup" aria-label="Stencil colour">
          <button class="swatch-btn active" data-colour="#FF007F" style="--swatch: #FF007F" aria-label="Electric magenta" aria-pressed="true"></button>
          <button class="swatch-btn" data-colour="#FF0000" style="--swatch: #FF0000" aria-label="Vivid scarlet" aria-pressed="false"></button>
          <button class="swatch-btn" data-colour="#FF5500" style="--swatch: #FF5500" aria-label="Safety orange" aria-pressed="false"></button>
          <button class="swatch-btn" data-colour="#20D000" style="--swatch: #20D000" aria-label="Chartreuse lime" aria-pressed="false"></button>
          <button class="swatch-btn" data-colour="#00AEEF" style="--swatch: #00AEEF" aria-label="Electric cyan" aria-pressed="false"></button>
        </div>
      </div>
    </details>

    <!-- Export: last on the page. Width/DPI are shared across modes; only the
         download button matching data-mode-btn is shown. -->
    <section class="export-row" id="export-row">
      <h2>Export</h2>
      <div class="field-row">
        <label>Width (cm)
          <input type="number" id="in-print-width" min="0.5" step="0.1" value="15">
        </label>
        <label>DPI
          <input type="number" id="in-print-dpi" min="72" max="1200" step="1" value="203">
        </label>
      </div>
      <p class="hint" id="output-size-hint"></p>

      <button class="primary-btn" id="export-stencil-btn" data-mode-btn="stencil">Download Stencil (thermal printer)</button>
      <button class="primary-btn" id="export-reference-btn" data-mode-btn="reference">Download Grayscale Reference</button>
      <button class="primary-btn" id="export-colour-btn" data-mode-btn="colour">Download Stencil + Reference (Colour)</button>
    </section>

  </section>
</main>

<script type="module" src="js/main.js?v=14"></script>
</body>
</html>
